name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compiler
        working-directory: UhcSharedHealth-v3.4
        run: mvn -B package
      - name: Envoyer le jar
        uses: actions/upload-artifact@v4
        with:
          name: UhcSharedHealth
          path: UhcSharedHealth-v3.4/target/UhcSharedHealth-1.0.jar
